[project]
name = "agent-score-engine"
version = "0.1.0"
description = "Deterministic credit scoring engine for Agent-Score"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.111.0", "uvicorn>=0.30.0"]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_score_engine*", "api*"]
namespaces = false
